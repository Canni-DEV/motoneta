    <path d="m832 98 8 33 18 35-15-4-8 12-16-35-5-34z" fill="#d8332f" stroke-width="4"/>
    <path d="m616 111-8 27-10 20m226-47 8 27 10 20" fill="none" stroke="#f5ead6" stroke-width="3"/>
    <path d="m606 95 21 6-3 12-21-6zm228 0-21 6 3 12 21-6z" fill="#202321" stroke-width="3"/>

    <!-- Stem and layered plinth make a continuous, stable silhouette. -->
