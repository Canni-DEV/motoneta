    <path d="M648 50q72-12 144 0-72 16-144 0z" fill="#202321" stroke="none"/>
    <path d="M649 62q42 7 81 5" fill="none" stroke="#d8332f" stroke-width="3"/>

    <!-- Champion's medallion, large enough to read on a small card. -->
    <circle cx="720" cy="119" r="27" fill="#f5ead6" stroke-width="4"/>
    <circle cx="720" cy="119" r="21" fill="none" stroke="#d8332f" stroke-width="2"/>
    <path d="m720 102 5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" fill="#202321" stroke="none"/>
