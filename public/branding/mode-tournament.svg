    <path d="M682 225h73" fill="none" stroke="#f5ead6" stroke-width="3"/>
    <path d="M659 235h122v29H659z" fill="#202321"/>
    <path d="M665 238h110" stroke="#f5ead6" stroke-width="3"/>
    <path d="M696 246h48v12h-48z" fill="#f5ead6" stroke="none"/>
    <path d="M706 252h28" fill="none" stroke-width="2"/>

    <!-- Curved bowl with flat highlights, matching the rider's inked style. -->
    <path d="M638 56h164l-10 58c-6 32-22 57-54 64h-36c-32-7-48-32-54-64z" fill="#d8332f"/>
    <path d="m650 72 17 3 9 43c4 18 11 31 23 42-22-10-32-26-36-47z" fill="#f5ead6" stroke="none"/>
